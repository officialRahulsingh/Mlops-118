name: Deploy House Price MLOps

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t rahulsinghdocker1998/house-price-api:latest .

      # 4. Push Docker image to Docker Hub
      - name: Push Docker image
        run: |
          docker push \
            rahulsinghdocker1998/house-price-api:latest

      # 5. Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |

            # Pull latest image
            docker pull rahulsinghdocker1998/house-price-api:latest

            # Stop old container
            docker stop house-price-api || true

            # Remove old container
            docker rm house-price-api || true

            # Start new container
            docker run -d \
              --name house-price-api \
              -p 8000:8000 \
              -e MLFLOW_TRACKING_URI=http://3.229.3.201:5000 \
              --restart unless-stopped \
              rahulsinghdocker1998/house-price-api:latest